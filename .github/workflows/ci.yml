name: v0.1 acceptance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-fictional-data-only
          POSTGRES_DB: sales_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci-fictional-data-only@127.0.0.1:5432/sales_test
      TEST_DATABASE_URL: postgresql://postgres:ci-fictional-data-only@127.0.0.1:5432/sales_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build -w @ake/contracts
      - run: npm run migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:public
